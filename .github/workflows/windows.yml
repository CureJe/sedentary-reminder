name: Windows build and UI checks

on:
  push:
    branches: [main, codex/english-only]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Check committed English content and checksum
        run: python tests/check_english.py
      - name: Build and check Windows UI
        shell: powershell
        run: ./tests/check-english.ps1
